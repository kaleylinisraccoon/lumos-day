
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F6FC">

  <title>Lumos Day ♡</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== 基本設定 ===== */

    :root {
      --bg: #F8F6FC;
      --lavender: #EEE8F8;
      --light-purple: #E4DCF2;
      --purple: #9882C5;
      --deep-purple: #78699E;
      --text: #766B89;
      --muted: #A69ABD;
      --white: #FFFDFF;
      --border: #EAE2F3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Nunito",
        "Zen Maru Gothic",
        "Noto Sans TC",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== 頁首 ===== */

    header {
      text-align: center;
      padding: 30px 15px 22px;
    }

    header h1 {
      margin: 0;
      color: var(--purple);
      font-family: "Nunito", sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    header .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-family: "Nunito", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    /* ===== 主視覺區 ===== */

    .hero {
      max-width: 650px;
      min-height: 205px;
      margin: 24px auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;

      background: linear-gradient(
        135deg,
        #EEE8F8,
        #F6F1FA
      );

      border: 1px solid #E7DDF2;
      border-radius: 27px;
    }

    .hero .paw {
      font-size: 19px;
      margin-bottom: 12px;
    }

    .hero h2 {
      margin: 0;
      color: var(--deep-purple);
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 27px;
      font-weight: 900;
    }

    .hero p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    /* ===== 交往天數 ===== */

    .anniversary {
      width: calc(100% - 36px);
      max-width: 420px;
      margin: 24px auto 32px;
      padding: 27px 20px 30px;

      text-align: center;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow:
        0 10px 30px rgba(125, 104, 166, 0.07);
    }

    .anniversary .label {
      color: var(--muted);
      font-family: "Nunito", sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    #days {
      margin: 17px 0 10px;
      color: var(--purple);
      font-family: "Nunito", sans-serif;
      font-size: 45px;
      font-weight: 800;
      line-height: 1.2;
    }

    .date {
      color: var(--muted);
      font-family: "Nunito", sans-serif;
      font-size: 12px;
      font-weight: 600;
    }

    .anniversary .love-message {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    /* ===== 功能選單 ===== */

    .menu {
      width: calc(100% - 30px);
      max-width: 620px;
      margin: 32px auto;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .item {
      min-height: 145px;
      padding: 25px 10px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      text-decoration: none;

      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;

      color: var(--deep-purple);
      transition: all 0.25s ease;
    }

    .item:hover {
      background: var(--lavender);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(125, 104, 166, 0.09);
    }

    .item:active {
      transform: scale(0.97);
    }

    .item .emoji {
      margin-bottom: 11px;
      font-size: 27px;
    }

    .item strong {
      font-family: "Nunito", sans-serif;
      font-size: 14px;
      font-weight: 900;
    }

    .item small {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    /* ===== 頁尾 ===== */

    .message {
      margin: 35px 15px;
      text-align: center;
      color: var(--muted);
      font-family: "Nunito", sans-serif;
      font-size: 14px;
      font-weight: 600;
    }

    footer {
      padding: 28px 10px 35px;
      text-align: center;
      color: #BBAFD0;
      font-family: "Nunito", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* ===== 手機版 ===== */

    @media (max-width: 480px) {

      header {
        padding-top: 27px;
      }

      header h1 {
        font-size: 33px;
      }

      .hero {
        min-height: 185px;
        margin: 20px 16px;
        padding: 30px 15px;
      }

      .hero h2 {
        font-size: 23px;
      }

      #days {
        font-size: 39px;
      }

      .menu {
        gap: 11px;
      }

      .item {
        min-height: 132px;
        padding: 20px 5px;
      }

      .item strong {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- 頁首 -->
  <header>
    <h1>Lumos Day 🐕</h1>
    <div class="subtitle">
      Curly Dog &amp; Sleepy Cat
    </div>
  </header>

  <main>

    <!-- 主視覺 -->
    <section class="hero">
      <div class="paw">🐾</div>

      <h2>月が綺麗ですね。</h2>

      <p>一週年特輯</p>
    </section>

    <!-- 交往天數 -->
    <section class="anniversary">

      <div class="label">
        OUR LOVE DAYS
      </div>

      <div id="days">
        𓃠
      </div>

      <div class="date">
        Since December 21, 2025
      </div>

      <p class="love-message">
        一年啦！一年啦！明年就兩年啦！
      </p>

    </section>

    <!-- 功能入口 -->
    <section class="menu">

      <a class="item" href="#memories">
        <span class="emoji">📷</span>
        <strong>Fur Memories</strong>
        <small>毛毛相簿</small>
      </a>

      <a class="item" href="#letters">
        <span class="emoji">💌</span>
        <strong>Do you copy?</strong>
        <small>留言區</small>
      </a>

      <a class="item" href="#dates">
        <span class="emoji">🗓️</span>
        <strong>Where are we going?</strong>
        <small>去哪裡?</small>
      </a>

      <a class="item" href="#rewards">
        <span class="emoji">🎟️</span>
        <strong>Good Turns!</strong>
        <small>好寶寶集點卡</small>
      </a>

    </section>

    <!-- 小語 -->
  </main>

  <!-- 頁尾 -->
  <footer>
    Made with sleepy, coffee, and love U. 
    <p>© Lumos Day</p>
  </footer>

  <!-- 交往天數計算 -->
  <script>
    const startDate = new Date(2025, 11, 21);
    const today = new Date();

    startDate.setHours(0, 0, 0, 0);
    today.setHours(0, 0, 0, 0);

    const days = Math.floor(
      (today - startDate) / (1000 * 60 * 60 * 24)
    ) + 1;

    document.getElementById("days").textContent =
      days >= 1 ? days + " DAYS ♡" : "COMING SOON ♡";
  </script>

</body>
</html>
